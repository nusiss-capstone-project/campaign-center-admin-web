# SonarCloud Automatic Analysis config
# (CI-based scans use sonar-project.properties; Automatic Analysis uses this file.)
#
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
# Prefer also setting the same exclusions in SonarCloud UI:
#   Project > Administration > General Settings > Analysis Scope > Source File Exclusions

sonar.sources=src

# Exclude OpenAPI-generated clients (false positives: eslint-disable, thenable, CPD).
sonar.exclusions=src/lib/api/**,src/lib/reward-api/**,**/.next/**,**/node_modules/**,**/dist/**,**/coverage/**

sonar.cpd.exclusions=src/lib/api/**,src/lib/reward-api/**
