# Used by CI-based SonarScanner (if/when a Sonar GitHub Action is added).
# SonarCloud Automatic Analysis ignores this file — use .sonarcloud.properties instead.

sonar.sources=src
sonar.exclusions=src/lib/api/**,src/lib/reward-api/**,**/.next/**,**/node_modules/**,**/dist/**,**/coverage/**
sonar.cpd.exclusions=src/lib/api/**,src/lib/reward-api/**
